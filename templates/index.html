<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0f2ac1f.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- SVG Hintergrund -->
  <svg class="bcg" preserveAspectRatio="xMidYMid slice" viewBox="10 10 80 80">
    <defs>
      <style>
        @keyframes rotate {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .out-top { animation: rotate 20s linear infinite; transform-origin: 13px 25px; }
        .in-top { animation: rotate 10s linear infinite; transform-origin: 13px 25px; }
        .out-bottom { animation: rotate 25s linear infinite; transform-origin: 84px 93px; }
        .in-bottom { animation: rotate 15s linear infinite; transform-origin: 84px 93px; }
      </style>
    </defs>
    <path fill="#f780600f" class="out-top" d="M37-5C25.1-14.7,5.7-19.1-9.2-10-28.5,1.8-32.7,31.1-19.8,49c15.5,21.5,52.6,22,67.2,2.3C59.4,35,53.7,8.5,37-5Z"/>
    <path fill="#f780600f" class="in-top" d="M20.6,4.1C11.6,1.5-1.9,2.5-8,11.2-16.3,23.1-8.2,45.6,7.4,50S42.1,38.9,41,24.5C40.2,14.1,29.4,6.6,20.6,4.1Z"/>
    <path fill="#f780600f" class="out-bottom" d="M105.9,48.6c-12.4-8.2-29.3-4.8-39.4,0.8-23.4,12.8-37.7,51.9-19.1,74.1s63.9,15.3,76-5.6c7.6-13.3,1.8-31.1-2.3-43.8C117.6,63.3,114.7,54.3,105.9,48.6Z"/>
    <path fill="#f780600f" class="in-bottom" d="M102,67.1c-9.6-6.1-22-3.1-29.5,2-15.4,10.7-19.6,37.5-7.6,47.8s35.9,3.9,44.5-12.5C115.5,92.6,113.9,74.6,102,67.1Z"/>
  </svg>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar glass">
      <div class="logo">
        <img src="https://helpcare.de/wp-content/uploads/2025/07/path1.png" alt="Logo">
      </div>
      <ul class="nav">
        <li class="active"><i class="fas fa-home"></i> Dashboard</li>
        <li><i class="fas fa-calendar-alt"></i><a style="cursor: pointer; all: unset;" href="https://calendar.google.com/calendar/u/0/r"> Kalendar</a></li>
        <li><i class="fas fa-life-ring" href="mailto:o.pawlowski@helpcare.de"></i> Hilfe</li>
        <li><i class="fas fa-calculator"></i> Kostenrechner</li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar glass">
        <h1>Dashboard</h1>
        <div style="text-align: right;">
          <h1 class="date-gradient">{{ aktuelles_datum }}</h1>
        </div>
      </div>

      <!-- KPI Cards -->
      <section class="kpis">
        <div class="kpi-card glass"><h4>Anfragen</h4><p>23</p></div>
        <div class="kpi-card glass"><h4>Einsätze</h4><p>70</p></div>
        <div class="kpi-card glass"><h4>Betreuungskräfte</h4><p>500</p></div>
      </section>
      
      <section class="middle-row">
        <div class="einsaetze glass">
          <h3>Anfragen</h3>
          <div id="einsatzList">
            <p>Lade Anfragen...</p>
          </div>
        </div>

        <div class="kpi-score glass" id="whatsapp-box">
          <h3>Whatsapp Nachrichten</h3>
          <div id="whatsapp-messages">Lade Nachrichten...</div>
        </div>

        <!-- Teamnotizen statt persönliche Notizen -->
        <div class="team-notes glass">
          <div class="team-notes-header">
            <h3>Teamnotizen</h3>
            <form id="teamNoteForm" class="team-note-form">
              <input type="text" name="content" placeholder="Neue Notiz hinzufügen..." required />
              <button type="submit">Speichern</button>
            </form>
          </div>
          <div id="teamNotesList" class="team-notes-list">
            <!-- Notizen -->
          </div>
        </div>

      </section>

      <!-- Gmail Bereich -->
      <section class="working-format glass">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem;">
          <h3>Gmail</h3>
          <a href="/gmail/connect" class="btn-small">Gmail verbinden</a>
        </div>
        <ul id="email-list">
          <li>Lade E-Mails...</li>
        </ul>
      </section>
    </main>
  </div>

 <!-- Whatsapp -->
<script>
  const CHATWOOT_URL = "https://app.chatwoot.com/app/accounts/130586/dashboard";
  const whatsappBox = document.getElementById("whatsapp-messages");

  // Delegiertes Click/Keyboard-Handling (einmalig binden, funktioniert auch nach Re-Render)
  whatsappBox.addEventListener("click", (e) => {
    const card = e.target.closest(".message");
    if (!card) return;
    window.location.href = CHATWOOT_URL;
  });
  whatsappBox.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target.closest(".message")) {
      e.preventDefault();
      window.location.href = CHATWOOT_URL;
    }
  });

  async function ladeNachrichten() {
    try {
      const res = await fetch("/api/whatsapp-messages");
      const daten = await res.json();

      if (!daten.length) {
        whatsappBox.innerHTML = "<p>Keine neuen Nachrichten.</p>";
        return;
      }

      // Karten rendern – klickbar & tastaturbedienbar
      whatsappBox.innerHTML = daten.map(n => `
        <div class="message glass" role="button" tabindex="0" style="cursor:pointer;">
          <strong>${n.contact}</strong><br>
          ${n.text}<br>
          <small>${new Date(n.time).toLocaleString("de-DE")}</small>
        </div>
      `).join("");

    } catch (err) {
      whatsappBox.innerHTML = "<p>Fehler beim Laden der Nachrichten.</p>";
      console.error(err);
    }
  }

  ladeNachrichten();
  setInterval(ladeNachrichten, 10000); // alle 30s neu laden
</script>

 <script>
  const einsatzList = document.getElementById("einsatzList");
  let einsaetzeController = null; // verhindert Überschneidungen

  async function loadEinsaetze() {
    // laufende Anfrage abbrechen, falls noch offen
    if (einsaetzeController) einsaetzeController.abort();
    einsaetzeController = new AbortController();

    try {
      const res = await fetch("/api/get-anfragen", {
        cache: "no-store",           // Browser-Cache umgehen
        signal: einsaetzeController.signal,
        headers: { "Accept": "application/json" }
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      // Render
      einsatzList.innerHTML = (data && data.length)
        ? data.map(item => `
            <div class="meeting-card glass" role="button" tabindex="0">
              <strong>${item.name}</strong><br>
              <small>📞 ${item.tel}</small>
            </div>
          `).join("")
        : "<p>Keine Anfragen vorhanden.</p>";

      // Click & Keyboard (delegiert, funktioniert auch nach Re-Render)
      einsatzList.querySelectorAll(".meeting-card").forEach(card => {
        card.addEventListener("click", () => {
          window.location.href = "https://app.maidplus.de/client";
        });
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            window.location.href = "https://app.maidplus.de/client";
          }
        });
      });

    } catch (err) {
      if (err.name === "AbortError") return; // durch neuen Poll ersetzt
      console.error(err);
      einsatzList.innerHTML = "<p>❌ Fehler beim Laden der Anfragen.</p>";
    }
  }

  // Initial + Polling z.B. alle 15s
  loadEinsaetze();
  setInterval(loadEinsaetze, 15000);
</script>
  
  <!-- Team laden -->
  <script>
    const teamGrid = document.getElementById('teamGrid');

    function renderTeam(items) {
      if (!items.length) {
        teamGrid.innerHTML = '<p>Kein Team vorhanden.</p>';
        return;
      }
      teamGrid.innerHTML = items.map(u => `
        <div class="team-card glass">
          <img src="${u.avatar}" alt="${u.name || u.username}" />
          <div class="team-card-body">
            <div class="team-card-name">${u.name || u.username}</div>
            <div class="team-card-role">${u.role || ''}</div>
            <div class="team-card-email">${u.email}</div>
          </div>
        </div>
      `).join('');
    }

    async function loadTeam() {
      try {
        const res = await fetch('/api/users');
        const items = await res.json();
        renderTeam(items);
      } catch (e) {
        teamGrid.innerHTML = '<p>Fehler beim Laden des Teams.</p>';
      }
    }

    loadTeam();
  </script>

  <!-- Teamnotizen laden/hinzufügen/löschen mit Auto-Reload -->
  <script>
    const teamNotesList = document.getElementById('teamNotesList');
    const teamNoteForm = document.getElementById('teamNoteForm');

    function renderNotes(items) {
      if (!items.length) {
        teamNotesList.innerHTML = '<p>Keine Teamnotizen vorhanden.</p>';
        return;
      }
      teamNotesList.innerHTML = items.map(n => `
        <div class="team-note-item glass">
          <div class="team-note-content">${n.content}</div>
          <div class="team-note-meta">${n.author || ''} • ${new Date(n.created_at).toLocaleString('de-DE')}</div>
          <button class="team-note-delete" data-id="${n.id}">Löschen</button>
        </div>
      `).join('');
      document.querySelectorAll('.team-note-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          try {
            const res = await fetch(`/api/team-notes/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Fehler beim Löschen');
            await loadNotes();
          } catch (err) {
            alert('❌ ' + err.message);
          }
        });
      });
    }

    async function loadNotes() {
      try {
        const res = await fetch('/api/team-notes');
        const items = await res.json();
        renderNotes(items);
      } catch (e) {
        teamNotesList.innerHTML = '<p>Fehler beim Laden der Notizen.</p>';
      }
    }

    teamNoteForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(teamNoteForm);
      const payload = Object.fromEntries(formData.entries());
      try {
        const res = await fetch('/api/team-notes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Fehler beim Speichern');
        teamNoteForm.reset();
        await loadNotes();
      } catch (e) {
        alert('❌ ' + e.message);
      }
    });

    // Erste Ladung
    loadNotes();

    // 🔄 Auto-Reload jede 1 Sekunde
    setInterval(loadNotes, 1000);
  </script>

  <!-- Gmail laden -->
  <script>
    fetch("/api/emails")
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById("email-list");
        list.innerHTML = "";
        data.forEach(mail => {
          const li = document.createElement("li");
          const link = document.createElement("a");
          link.href = "https://mail.google.com/mail/u/0/#inbox";
          link.target = "_blank";
          link.innerHTML = `<strong>${mail.from}</strong><br>${mail.subject}<br><small>${mail.time}</small>`;
          li.appendChild(link);
          list.appendChild(li);
        });
      })
      .catch(() => {
        document.getElementById("email-list").innerHTML = "<li>❌ Fehler beim Laden</li>";
      });
  </script>
</body>
</html>
